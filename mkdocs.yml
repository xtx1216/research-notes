# ============================================================
# 基本信息
# ============================================================

site_name: XTX · VLA研究笔记
site_url: https://xtx1216.github.io/research-notes/
site_description: VLA / Reinforcement Learning / Robotics / Research Notes
site_author: xtx

repo_url: https://github.com/xtx1216/research-notes
repo_name: + 新建笔记

copyright: Copyright &copy; 2026 xtx


# ============================================================
# Material 主题
# ============================================================

theme:
  name: material
  custom_dir: overrides
  language: zh

  # 左上角图标
  icon:
    logo: material/book-open-page-variant

  # 明暗主题
  palette:

    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

  features:

    # --------------------------------------------------------
    # 导航
    # --------------------------------------------------------

    # 页面切换更快
    - navigation.instant

    # URL 随当前标题变化
    - navigation.tracking

    # 让章节 index.md 成为章节标题本身
    - navigation.indexes

    # 页面向下滚动后显示“返回顶部”
    - navigation.top

    # --------------------------------------------------------
    # 右侧文章目录
    # --------------------------------------------------------

    - toc.follow

    # --------------------------------------------------------
    # 搜索
    # --------------------------------------------------------

    - search.suggest
    - search.highlight
    - search.share

    # --------------------------------------------------------
    # 代码
    # --------------------------------------------------------

    - content.code.copy
    - content.code.annotate


# ============================================================
# 自定义样式
# ============================================================

extra_css:
  - assets/stylesheets/extra.css


# ============================================================
# 插件
# ============================================================

plugins:

  # MkDocs 自带搜索
  - search:
      lang:
        - zh
        - en

  # 从 docs/**/.nav.yml 生成导航，新页面会自动加入对应章节
  - awesome-nav


# ============================================================
# Markdown 扩展
# ============================================================

markdown_extensions:

  # ----------------------------------------------------------
  # 提示框
  # ----------------------------------------------------------

  - admonition

  - pymdownx.details

  - pymdownx.superfences


  # ----------------------------------------------------------
  # 代码高亮
  # ----------------------------------------------------------

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite


  # ----------------------------------------------------------
  # 数学公式
  # ----------------------------------------------------------

  - pymdownx.arithmatex:
      generic: true


  # ----------------------------------------------------------
  # Markdown 常用增强
  # ----------------------------------------------------------

  - attr_list

  - md_in_html

  - tables

  - footnotes

  - def_list

  - toc:
      permalink: true
      toc_depth: 3


  # ----------------------------------------------------------
  # Emoji / Material 图标
  # ----------------------------------------------------------

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


  # ----------------------------------------------------------
  # Tab
  # ----------------------------------------------------------

  - pymdownx.tabbed:
      alternate_style: true


  # ----------------------------------------------------------
  # 键盘按键
  # ----------------------------------------------------------

  - pymdownx.keys


  # ----------------------------------------------------------
  # 删除线 / 下划线等
  # ----------------------------------------------------------

  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde


# ============================================================
# MathJax：先加载本地配置，再加载渲染库
# ============================================================

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/toc-active.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


# ============================================================
# 页脚 / 社交信息
# ============================================================

extra:
  pages_cms_url: https://app.pagescms.org/

  generator: false
